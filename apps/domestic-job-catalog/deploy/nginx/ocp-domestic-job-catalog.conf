upstream ocp_domestic_job_catalog_api {
    least_conn;
    server 127.0.0.1:4310 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4311 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4312 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4313 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name domesticjobs.catalog.pageflux.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name domesticjobs.catalog.pageflux.net;

    ssl_certificate /etc/letsencrypt/live/domesticjobs.catalog.pageflux.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domesticjobs.catalog.pageflux.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ocp-domestic-job-catalog.access.log;
    error_log /var/log/nginx/ocp-domestic-job-catalog.error.log;

    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /ocp/objects/sync/stream {
        proxy_pass http://ocp_domestic_job_catalog_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ocp_domestic_job_catalog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
